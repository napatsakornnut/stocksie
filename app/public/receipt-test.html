<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; background: #888; font-family: "Sukhumvit Set", "Thonburi", "Sarabun", sans-serif; }
  #receipt {
    width: 380px; margin: 24px auto; background: #fff; color: #111;
    padding: 24px 20px; font-family: "Courier New", monospace; font-size: 15px; line-height: 1.6;
  }
  .center { text-align: center; }
  .row { display: flex; justify-content: space-between; gap: 8px; }
  .name { flex: 1; }
  hr { border: none; border-top: 1px dashed #999; margin: 10px 0; }
  .total { font-weight: bold; font-size: 17px; }
</style>
</head>
<body>
<div id="receipt">
  <div class="center"><strong>ร้านชำสบายกระเป๋า</strong></div>
  <div class="center">123 ถนนสุขุมวิท กรุงเทพฯ 10110</div>
  <div class="center">โทร 02-123-4567</div>
  <div class="center">10 ต.ค. 2026 09:15 · ใบเสร็จ A-00123</div>
  <hr>
  <div class="row"><span class="name">นมสด 1 ลิตร ×2</span><span>94.00</span></div>
  <div class="row"><span class="name">ข้าวหอมมะลิ 5 กก. ×1</span><span>185.00</span></div>
  <div class="row"><span class="name">ไข่ไก่ 12 ฟอง ×1</span><span>58.00</span></div>
  <div class="row"><span class="name">น้ำดื่ม 600ml ×6</span><span>48.00</span></div>
  <hr>
  <div class="row total"><span>รวม</span><span>385.00</span></div>
  <div class="row"><span>รับเงิน</span><span>400.00</span></div>
  <div class="row"><span>ทอน</span><span>15.00</span></div>
  <hr>
  <div class="center">ขอบคุณที่มาอุดหนุน 🙏</div>
  <div class="center">อย่าลืมรับ point สะสม</div>
</div>
</body>
</html>
