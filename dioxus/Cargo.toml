[package]
name = "stocksie-dioxus"
version = "0.1.0"
edition = "2021"
description = "RIIR prototype — Stocksie household reader in Dioxus/WASM (plan 007)"

# Detach from the Anchor workspace at the repo root (its members = programs/*).
[workspace]

[dependencies]
dioxus = { version = "0.7", features = ["web"] }
gloo-net = "0.8"
gloo-timers = "0.3"
# 2.x: Pubkey::find_program_address / from_bytes live here (3.x moved them);
# curve25519 gates PDA derivation off the solana SBF target
solana-pubkey = { version = "2", features = ["curve25519"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
# Anchor discriminator (sha256("account:Name")[..8]) + RPC memcmp filter encoding
sha2 = "0.10"
bs58 = "0.5"
blake3 = "1"
# Wallet Standard interop (injected provider on window.*)
wasm-bindgen = "0.2"
js-sys = "0.3"
wasm-bindgen-futures = "0.4"
# receipt file input (reads the picked File's bytes directly)
web-sys = { version = "0.3", features = ["HtmlInputElement", "File", "Blob", "Window", "Document", "Storage", "Clipboard", "Navigator", "HtmlElement"] }

[dev-dependencies]
# native-only E2E test: signs with a local ed25519 key and executes the real
# instructions against a running localnet (skips when none is reachable)
ed25519-dalek = "2"
ureq = { version = "2", features = ["json"] }
